name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Nothing personal, oversized or non-OGL
        run: python3 tools/check_public.py

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Python tools compile
        run: python3 -m py_compile paths.py tools/*.py pages/authority/stratford-dc/nppf-decisions/build/*.py site/seo.py

      - name: NPPF Markdown edition is in sync with the text and passes its checks
        run: |
          uv run tools/nppf_md.py build
          git diff --exit-code -I '^Generated ' -- data/open-sources/nppf
          uv run tools/nppf_md.py check

      - name: Decisions index is in sync with the case files
        run: |
          uv run tools/build_index.py
          git diff --exit-code -I '^Generated ' -- data/decisions/index

      - name: Harvest watermarks readable
        run: python3 tools/harvest.py status

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: pages/england/nppf-navigator/package-lock.json

      - name: pdftotext (Navigator quote verification)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Navigator typecheck, tests and build (verifies every NPPF quotation)
        working-directory: pages/england/nppf-navigator
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Site tools parse
        run: node --check site/finish.mjs && node --check pages/england/sustainable-location/service-village/build.mjs && node --check pages/england/sustainable-location/factors/build.mjs && node --check pages/england/sustainable-location/factors/register.mjs
